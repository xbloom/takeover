# macOS透明代理pfctl规则 - 正确版本
# 这个配置能真正拦截出站流量

# 第一步：在lo0上设置rdr规则（拦截流量）
rdr pass on lo0 inet proto tcp from any to any port 80 -> 127.0.0.1 port 1080
rdr pass on lo0 inet proto tcp from any to any port 443 -> 127.0.0.1 port 1080
rdr pass on lo0 inet proto tcp from any to any port 8080 -> 127.0.0.1 port 1080

# 第二步：将出站流量路由到lo0（关键！）
# 这样出站流量会变成lo0的入站流量，从而被上面的rdr规则捕获
pass out route-to (lo0 127.0.0.1) inet proto tcp from any to any port 80 keep state
pass out route-to (lo0 127.0.0.1) inet proto tcp from any to any port 443 keep state
pass out route-to (lo0 127.0.0.1) inet proto tcp from any to any port 8080 keep state
