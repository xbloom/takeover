[package]
name = "takeover"
version = "0.1.0"
edition = "2021"
description = "A Rust program for transparent proxy traffic forwarding like Proxifier"
authors = ["Developer"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
sysinfo = "0.30"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
nix = { version = "0.28", features = ["process", "signal"] }
libc = "0.2"
regex = "1.0"
url = "2.0"
# TLS 拦截功能依赖 (总是启用，运行时配置)
async-trait = "0.1"
rustls = "0.22"
tokio-rustls = "0.25"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
rustls-pemfile = "2.0"
time = "0.3"
base64 = "0.22.1"
sha1 = "0.10.6"

# Lua 脚本引擎依赖
mlua = { version = "0.9", features = ["lua54", "async", "serialize"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio-stream = "0.1"
reqwest = { version = "0.11", features = ["json"] }
hyper = { version = "1.7.0",features = ["full"] }
http-body-util = { version = "0.1.3" }
hyper-util = { version = "0.1.16", features = ["tokio", "http2", "server"] }
bytes = { version = "1.10.1" }
fastrand = "2.0"
rustls-native-certs = { version = "0.8.1", registry = "rsproxy" }
rustls-pki-types = { version = "1.12.0", registry = "rsproxy" }
webpki-roots = { version = "1.0.2", registry = "rsproxy" }


# Platform-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
system-configuration = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-route = "0.17"
rtnetlink = "0.13"

[lib]
name = "takeover"
path = "src/lib.rs"

[[bin]]
name = "takeover"
path = "src/main.rs"

[features]
default = []

[[example]]
name = "transparent_proxy_demo"
path = "examples/transparent_proxy_demo.rs"

[[example]]
name = "tls_interception_demo"
path = "examples/tls_interception_demo.rs"

[[example]]
name = "complete_tls_proxy_demo"
path = "examples/complete_tls_proxy_demo.rs"


[[example]]
name = "simple_tls_test"
path = "examples/simple_tls_test.rs"

[dev-dependencies]
tempfile = "3.8"
